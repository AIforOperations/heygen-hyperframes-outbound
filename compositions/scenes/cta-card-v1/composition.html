<!--
  Scene: cta-card-v1
  Category: cta-card · Variant: hero-reply

  Layout:
    - Eyebrow with sender attribution
    - Massive REPLY-style CTA headline (3-6 words, punchy)
    - Subline beneath with the specific ask + timing/no-risk
    - Small reply-arrow affordance with sender name/company

  Closes a sales video with a clear "reply to this message" CTA.
  No fake email, no QR — the prospect replies to the original message
  the video is embedded in.
-->
<style>
  #cta-card-v1 {
    background:
      radial-gradient(ellipse 70% 60% at 90% 90%, rgba(220, 38, 38, 0.14), transparent 65%),
      linear-gradient(135deg, var(--bg-2) 0%, var(--bg-3) 100%);
  }
  #cta-card-v1 .gz-safe {
    align-content: center;
    grid-template-rows: auto auto auto auto;
    row-gap: 24px;
  }
  #cta-card-v1 .eyebrow {
    grid-column: span 8;
    font-size: 22px;
    font-weight: var(--weight-medium);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 14px;
    font-feature-settings: "ss02", "cv11";
  }
  #cta-card-v1 .eyebrow::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.18);
  }
  #cta-card-v1 .cta {
    grid-column: span 8;
    font-size: 136px;
    font-weight: var(--weight-black);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--text);
    margin: 0;
    font-feature-settings: "ss02", "cv11";
  }
  #cta-card-v1 .cta .accent {
    color: var(--accent);
    font-style: italic;
  }
  #cta-card-v1 .subline {
    grid-column: span 8;
    font-size: 36px;
    font-weight: var(--weight-regular);
    color: var(--text-2);
    line-height: 1.3;
    max-width: 860px;
    font-feature-settings: "ss02", "cv11";
  }
  /* Reply affordance row — small but visually distinct.
     A return-arrow icon next to the sender attribution telegraphs
     "this is a message you reply to" without needing words. */
  #cta-card-v1 .reply-row {
    grid-column: span 8;
    margin-top: 18px;
    padding: 16px 22px;
    background: rgba(255, 255, 255, 0.65);
    border: 1px solid rgba(31, 26, 20, 0.10);
    border-radius: 14px;
    backdrop-filter: blur(4px);
    display: inline-flex;
    align-items: center;
    gap: 14px;
    width: fit-content;
    box-shadow: 0 4px 14px rgba(80, 30, 10, 0.06);
  }
  #cta-card-v1 .reply-arrow {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    color: var(--accent);
  }
  #cta-card-v1 .reply-text {
    font-size: 22px;
    font-weight: var(--weight-semibold);
    color: var(--text);
    letter-spacing: -0.005em;
    font-feature-settings: "ss02", "cv11";
  }
  #cta-card-v1 .reply-text .sep {
    color: var(--text-3);
    margin: 0 10px;
    font-weight: var(--weight-regular);
  }
  #cta-card-v1 .reply-text .who {
    color: var(--text-2);
    font-weight: var(--weight-regular);
  }
  /* Demo cursor — positioned absolutely over the scene, hidden initially.
     Animated by the script to travel toward the reply-row. */
  #cta-card-v1 .demo-cursor {
    position: absolute;
    width: 36px;
    height: 36px;
    right: 60px;
    top: 60px;
    z-index: 20;
    opacity: 0;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.22));
    pointer-events: none;
  }
  /* Click ripple — radial circle that scales out when the cursor "clicks." */
  #cta-card-v1 .demo-ripple {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    z-index: 19;
    opacity: 0;
    pointer-events: none;
    transform-origin: center center;
  }
</style>

<div id="cta-card-v1" class="graphics-zone clip"
     data-composition-id="cta-card-v1"
     data-start="{{__scene_start__}}"
     data-duration="{{__scene_duration__}}"
     data-width="1096"
     data-height="952"
     style="--accent: {{accent_color}};">

  <div class="gz-safe">
    {{#eyebrow}}
    <div class="eyebrow" data-iv-el="eyebrow">{{eyebrow}}</div>
    {{/eyebrow}}

    <h1 class="cta" data-iv-el="cta">{{cta_headline}}</h1>

    {{#cta_subline}}
    <p class="subline" data-iv-el="subline">{{cta_subline}}</p>
    {{/cta_subline}}

    <!-- Mouse cursor demo: travels from upper-right, lands on the reply
         row, "clicks" with a ripple. Suggests the action without saying
         "click here" — viewers recognize the cursor metaphor. -->
    <svg class="demo-cursor" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#1f1a14" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"
            d="M3 2 L3 18 L7 14 L9.8 20.2 L12.4 19 L9.6 12.8 L15 12.6 Z"/>
    </svg>
    <div class="demo-ripple" aria-hidden="true"></div>

    <div class="reply-row" data-iv-el="reply">
      <!-- Inline SVG return-arrow. Renders crisply at any zoom, no asset. -->
      <svg class="reply-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 14 4 9 9 4"></polyline>
        <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
      </svg>
      <span class="reply-text">
        Reply to this message<span class="sep">·</span><span class="who">{{sender_name}} at {{sender_company}}</span>
      </span>
    </div>
  </div>
</div>

<script data-scene="cta-card-v1">
  (function () {
    window.__timelines = window.__timelines || {};
    if (typeof gsap === "undefined") { window.__timelines["cta-card-v1"] = null; return; }
    const root = document.querySelector("#cta-card-v1");
    if (!root) { window.__timelines["cta-card-v1"] = null; return; }

    const tl = gsap.timeline({ paused: true });
    LF.slideIn(tl, root.querySelector(".eyebrow"), { x: -16, delay: 0, duration: 0.35 });
    LF.scalePop(tl, root.querySelector(".cta"), { delay: 0.15, from: 0.88, distance: 16, duration: 0.7 });
    LF.blurIn(tl, root.querySelector(".subline"), { delay: 0.55, distance: 12, blur: 4, duration: 0.5 });
    LF.scalePop(tl, root.querySelector(".reply-row"), { delay: 0.95, from: 0.96, distance: 14, duration: 0.5 });

    // Magnetic arrow oscillation telegraphs "this is the action" — pulled left
    // toward the reply-arrow icon as if drawn toward the reply
    LF.magneticOscillate(tl, root.querySelector(".reply-arrow"), {
      delay: 1.4, distance: 5, duration: 0.45, repeat: 3,
    });

    // Demo cursor: fade in upper-right, travel toward reply-row, "click"
    // with a ripple, then dissolve. Visual cue without saying "click here."
    const cursor = root.querySelector(".demo-cursor");
    const ripple = root.querySelector(".demo-ripple");
    const replyRow = root.querySelector(".reply-row");
    if (cursor && replyRow) {
      // Position the cursor's resting place near the start of the reply row.
      // Computed at animation time so it tracks the actual rendered position.
      tl.set(cursor, { opacity: 0, x: 0, y: 0, scale: 1 }, 1.8);
      tl.to(cursor, { opacity: 1, duration: 0.25 }, 1.85);
      // Move the cursor along a curved-ish path toward the reply row's top-left
      // (the reply-arrow icon area). We tween x/y on the cursor element with
      // power3.out for a natural deceleration.
      const rect = replyRow.getBoundingClientRect();
      const rootRect = root.getBoundingClientRect();
      const targetX = rect.left - rootRect.left - 950 + 20; // offset from cursor's CSS right: 60
      const targetY = rect.top  - rootRect.top  - 60  + 18;
      tl.to(cursor, {
        x: targetX, y: targetY,
        duration: 1.0, ease: "power3.out",
      }, 1.95);
      // Cursor "presses" — small scale down at the click moment
      tl.to(cursor, {
        scale: 0.85, duration: 0.12, ease: "power2.in",
      }, 2.85);
      tl.to(cursor, {
        scale: 1, duration: 0.18, ease: "back.out(2)",
      }, 2.97);
      // Ripple expands outward at click point
      if (ripple) {
        tl.set(ripple, {
          opacity: 0, scale: 0.4,
          x: targetX + 950 - 30 + 12,
          y: targetY + 60 + 12,
        }, 2.85);
        tl.to(ripple, {
          opacity: 0.9, scale: 1, duration: 0.18, ease: "power2.out",
        }, 2.88);
        tl.to(ripple, {
          opacity: 0, scale: 2.4, duration: 0.5, ease: "power2.out",
        }, 3.04);
      }
      // Cursor dissolves after the click
      tl.to(cursor, {
        opacity: 0, duration: 0.4, ease: "power2.in",
      }, 3.4);
    }

    window.__timelines["cta-card-v1"] = tl;
  })();
</script>
