<!--
  Scene: cta-card-v1
  Category: cta-card · Variant: hero-statement
  Duration range: 3–8s · Default: 5s

  Layout:
    - Eyebrow with sender attribution
    - Massive CTA headline
    - Subline beneath
    - Signature row (sender_name · sender_company · sender_email)
-->
<style>
  #cta-card-v1 {
    background:
      radial-gradient(ellipse 70% 60% at 90% 90%, rgba(220, 38, 38, 0.14), transparent 65%),
      linear-gradient(135deg, var(--bg-2) 0%, var(--bg-3) 100%);
  }
  #cta-card-v1 .gz-safe {
    align-content: center;
    grid-template-rows: auto auto auto auto;
    row-gap: 24px;
  }
  #cta-card-v1 .eyebrow {
    grid-column: span 8;
    font-size: 22px;
    font-weight: var(--weight-medium);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #cta-card-v1 .eyebrow::before {
    content: "";
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 6px rgba(220, 38, 38, 0.18);
  }
  #cta-card-v1 .cta {
    grid-column: span 8;
    font-size: 152px;
    font-weight: var(--weight-black);
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: var(--text);
    margin: 0;
  }
  #cta-card-v1 .cta .accent {
    color: var(--accent);
    font-style: italic;
  }
  #cta-card-v1 .subline {
    grid-column: span 8;
    font-size: 36px;
    font-weight: var(--weight-regular);
    color: var(--text-2);
    line-height: 1.3;
    max-width: 820px;
  }
  #cta-card-v1 .sig {
    grid-column: span 8;
    margin-top: 16px;
    padding-top: 20px;
    border-top: 1px solid rgba(31, 26, 20, 0.12);
    display: flex;
    align-items: baseline;
    gap: 16px;
    font-size: 22px;
    color: var(--text-2);
  }
  #cta-card-v1 .sig .name {
    color: var(--text);
    font-weight: var(--weight-semibold);
  }
  #cta-card-v1 .sig .sep {
    color: var(--text-3);
  }
  #cta-card-v1 .sig .email {
    margin-left: auto;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--text);
  }
</style>

<div id="cta-card-v1" class="graphics-zone clip"
     data-composition-id="cta-card-v1"
     data-start="{{__scene_start__}}"
     data-duration="{{__scene_duration__}}"
     data-width="1096"
     data-height="952"
     style="--accent: {{accent_color}};">

  <div class="gz-safe">
    <div class="eyebrow" data-iv-el="eyebrow">From {{sender_name}}</div>

    <h1 class="cta" data-iv-el="cta">
      <span class="accent">{{cta_headline}}</span>
    </h1>

    {{#cta_subline}}
    <p class="subline" data-iv-el="subline">{{cta_subline}}</p>
    {{/cta_subline}}

    <div class="sig" data-iv-el="sig">
      <span class="name">{{sender_name}}</span>
      <span class="sep">·</span>
      <span>{{sender_company}}</span>
      {{#sender_email}}
      <span class="email">{{sender_email}}</span>
      {{/sender_email}}
    </div>
  </div>
</div>

<script data-scene="cta-card-v1">
  (function () {
    window.__timelines = window.__timelines || {};
    if (typeof gsap === "undefined") { window.__timelines["cta-card-v1"] = null; return; }
    const root = document.querySelector("#cta-card-v1");
    if (!root) { window.__timelines["cta-card-v1"] = null; return; }

    const tl = gsap.timeline({ paused: true });
    tl.fromTo(root.querySelector(".eyebrow"),
      { opacity: 0, x: -16 },
      { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 0);
    tl.fromTo(root.querySelector(".cta"),
      { opacity: 0, scale: 0.86, y: 20 },
      { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.15);
    const sub = root.querySelector(".subline");
    if (sub) tl.fromTo(sub, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45 }, 0.55);
    tl.fromTo(root.querySelector(".sig"),
      { opacity: 0, y: 8 },
      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.85);
    window.__timelines["cta-card-v1"] = tl;
  })();
</script>
